version: '3.7'

services:
  mariadb:
    image: mariadb:10.11
    container_name: mariadb
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=metabase_root
      - MYSQL_DATABASE=metabase
      - MYSQL_USER=metabase
      - MYSQL_PASSWORD=metabase_pass
    ports:
      - "3306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    networks:
      - trino-network

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    hostname: clickhouse
    ports:
      - '8123:8123' # HTTP interface
      - '9002:9000' # Native TCP interface
    environment:
      - CLICKHOUSE_DB=default
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse-s3.xml:/etc/clickhouse-server/config.d/s3.xml:ro
      # - ./clickhouse-logs:/var/log/clickhouse-server # Activate if you want to see logs on your repo
      - ./users.xml:/etc/clickhouse-server/users.d/users.xml:ro
    networks:
      - trino-network

  minio:
    hostname: minio
    image: 'minio/minio:latest'
    container_name: minio
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    environment:
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: minio123
    command: server /data --console-address ":9001"
    networks:
      - trino-network

  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    ports:
      - "3000:3000"
    volumes:
      - metabase-data:/metabase-data
      - ./metabase-plugins:/plugins
    environment:
      MB_DB_TYPE: mysql
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 3306
      MB_DB_USER: metabase
      MB_DB_PASS: metabase_pass
      MB_DB_HOST: mariadb
    networks:
      - trino-network

  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    entrypoint: >
      /bin/sh -c '
      exit 0
      '
    networks:
      - trino-network
    depends_on:
      - minio

volumes:
  minio-data:
    driver: local
  clickhouse-data:
    driver: local
  metabase-data:
    driver: local
  mariadb-data:
    driver: local

networks:
  trino-network:
    driver: bridge